<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relic-scan · session star map</title>
<style>
  /* Hallmark · audit + fix: app shell sidebar · genre: atmospheric (dark AI tool, light twin) · tone: technical · anchor hue: cyan
   * fonts: system stacks on purpose (the page is offline, no font downloads) · ui sans for chrome, mono for data
   * pre-emit critique: P4 H4 E4 S4 R5 V3 */
  :root { --bg: #05070d; --ink: #d9dde8; --dim: #7c8496; --line: #1c2333; --panel: rgba(10, 13, 22, .92);
          --focus: #3a4766; --hover: #121827; --sel: #2a1a17; --track: #1a2030; --barbg: #2a3550; --barfg: #6b7fb0;
          --btn: #111727; --code: #c9d4ff; --link: #8fa3d6; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f5f6fa; --ink: #1c2233; --dim: #5d667a; --line: #d6dbe7; --panel: rgba(255, 255, 255, .95);
          --focus: #7d8bb5; --hover: #e9edf6; --sel: #fde6dc; --track: #e1e5ee; --barbg: #dde2ed; --barfg: #5b6fa6;
          --btn: #ffffff; --code: #2f47a6; --link: #3554b5; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; cursor: crosshair; }
  :root { --side: 232px; --amber: #f5b73b; --cyan: #67c8ef; --green: #6fd6a0; --card: #12151c; --sideb: #13161d;
          --raised: #1d2230; --on-amber: #1d1405; --accent: var(--cyan);
          --font-ui: -apple-system, system-ui, sans-serif; --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
          --ease-out: cubic-bezier(.2, .7, .2, 1); --dur-short: 120ms; }
  :root[data-theme="light"] { --amber: #b7791f; --cyan: #1f7fbf; --green: #1f9d63; --card: #fbfcfe; --sideb: #eceff5; --raised: #dde3ee; }
  @media (max-width: 1100px) { :root { --side: 64px; } #side .lbl, #side .brand .t, #side .foot { display: none; } }
  #bar { position: fixed; left: calc(var(--side) + 14px); top: 12px; right: 374px; display: flex; gap: 10px; align-items: center; }
  #q { flex: 1; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
       padding: 9px 12px; font: inherit; outline: none; }
  #q:focus { border-color: var(--focus); }
  #count { color: var(--dim); white-space: nowrap; }
  #legend { position: fixed; left: calc(var(--side) + 14px); bottom: 12px; display: flex; gap: 14px; color: var(--dim); align-items: center; flex-wrap: wrap; }
  #legend b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #legend button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #legend button.on { color: var(--ink); border-color: var(--focus); }
  #panel { overflow-x: hidden; position: fixed; top: 0; right: 0; bottom: 0; width: 360px; background: var(--panel); border-left: 1px solid var(--line);
           padding: 14px 16px; overflow-y: auto; }
  #panel h2 { font-size: 13px; margin: 14px 0 6px; color: var(--dim); font-weight: normal; text-transform: uppercase; letter-spacing: .06em; }
  #panel h2:first-child { margin-top: 0; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 2px 10px; }
  .kv span:nth-child(odd) { color: var(--dim); }
  .kv span { overflow-wrap: anywhere; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; overflow-wrap: anywhere; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row .n { color: var(--dim); text-align: right; }
  .bar { height: 3px; background: var(--barbg); margin: 0 4px 3px; border-radius: 2px; }
  .bar i { display: block; height: 100%; background: var(--barfg); border-radius: 2px; }
  .muted { color: var(--dim); }
  .btn { background: var(--btn); border: 1px solid var(--line); color: var(--ink); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; margin: 6px 6px 0 0; }
  .btn:hover { border-color: var(--focus); }
  code { color: var(--code); }
  #tabs { display: flex; gap: 4px; }
  #tabs a { color: var(--dim); text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 7px 11px; background: var(--panel); }
  #tabs a.on { color: var(--ink); border-color: var(--focus); }
  #tree { margin: 0 360px 0 var(--side); padding: 62px 14px 56px; display: none; }
  /* tree and paths: the page is the one scroll area (no scroll box inside the page) */
  html.doc, html.doc body { overflow-x: hidden; overflow-y: auto; height: auto; }
  html.doc #bar { top: 0; left: var(--side); padding: 12px 14px 8px; background: var(--bg); z-index: 2; }
  html.doc #legend { background: var(--bg); padding: 6px 8px; left: calc(var(--side) + 6px); bottom: 6px; border-radius: 6px; }
  /* sidebar: the Relic Studio shell */
  #side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); background: var(--sideb); border-right: 1px solid var(--line);
          z-index: 5; display: flex; flex-direction: column; padding: 22px 12px 18px; font-family: var(--font-ui); }
  #side .brand { display: flex; gap: 12px; align-items: center; padding: 0 6px 28px; }
  #side .logo { width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center;
                background: var(--raised); border: 1px solid var(--line); color: var(--accent); }
  #side .logo svg { width: 24px; height: 24px; }
  #side .t b { display: block; font-size: 18px; font-weight: 700; letter-spacing: .1em; color: var(--ink); line-height: 1.1; }
  #side .t i { display: block; font: 400 11px/1.4 var(--font-mono); letter-spacing: .28em; color: var(--dim); font-style: normal; }
  /* one icon voice: 24-unit grid, 1.6 stroke, round caps, currentColor */
  #side a { display: flex; gap: 12px; align-items: center; color: var(--ink); text-decoration: none; padding: 9px 10px; border-radius: 8px;
            font-size: 14.5px; font-weight: 500; margin-bottom: 2px; white-space: nowrap;
            transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
  #side .ic { width: 20px; height: 20px; flex: none; color: var(--dim); transition: color var(--dur-short) var(--ease-out); }
  #side .ic svg { width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #side a:hover { background: var(--hover); }
  #side a:hover .ic { color: var(--ink); }
  #side a.on { background: var(--raised); }
  #side a.on .ic { color: var(--accent); }
  #side a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #side .sep { height: 1px; background: var(--line); margin: 12px 10px; }
  #side .foot { margin-top: auto; padding: 0 10px; font-size: 12px; color: var(--dim); line-height: 1.5; }
  #side .foot b { color: var(--ink); letter-spacing: .14em; font-size: 11px; }
  #side .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 8px; }
  @media (max-width: 1100px) { #side { padding: 18px 10px; } #side .brand { padding: 0 2px 22px; } #side a { justify-content: center; padding: 10px 0; } }
  /* dashboard views: scan, banks, health */
  #dash { display: none; margin-left: var(--side); padding: 44px 48px 60px; max-width: 1180px; font-family: -apple-system, system-ui, sans-serif; }
  #dash .eyebrow { color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
  #dash h1 { font-size: 44px; line-height: 1.1; margin: 8px 0 8px; font-weight: 800; letter-spacing: -.01em; }
  #dash .sub { color: var(--dim); font-size: 17px; margin: 0 0 10px; }
  #dash .scope { color: var(--dim); font-size: 13px; margin: 0 0 30px; }
  #dash .scope b { color: var(--accent); font-weight: 600; }
  #dash .scope code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
  #side .rng { color: var(--accent); font-weight: 600; }
  #dash .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; margin-bottom: 18px; }
  #dash .card h3 { margin: 0 0 14px; font-size: 17px; color: var(--amber); display: flex; gap: 10px; align-items: center; }
  #dash .card h3.c { color: var(--cyan); }
  #dash .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 10px 0 24px; }
  #dash .stat .k { font-size: 11px; letter-spacing: .2em; color: var(--dim); font-weight: 700; text-transform: uppercase; }
  #dash .stat .v { font-size: 34px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #dash .ringwrap { display: grid; place-items: center; margin: 0 0 26px; }
  #dash .go { background: var(--amber); color: var(--on-amber); border: 0; border-radius: 10px; padding: 14px 26px;
              font: 700 17px -apple-system, system-ui, sans-serif; cursor: pointer; min-width: 220px; }
  #dash .go:disabled { opacity: .55; cursor: default; }
  #dash .ghost { background: var(--hover); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 14px 26px;
                 font: 600 17px -apple-system, system-ui, sans-serif; cursor: pointer; min-width: 220px; margin-left: 12px; }
  #dash .note { color: var(--dim); font-size: 13px; margin-top: 14px; }
  #dash .track { height: 6px; border-radius: 3px; background: var(--line); margin: 16px 0 6px; overflow: hidden; }
  #dash .track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  #dash .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  #dash .bank { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px; cursor: pointer; }
  #dash .bank:hover { border-color: var(--focus); }
  #dash .bank .n { color: var(--amber); font-weight: 700; font-size: 17px; margin-bottom: 4px; overflow-wrap: anywhere; }
  #dash .bank .p { color: var(--dim); font-size: 12px; margin-bottom: 14px; font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
  #dash .bank .nums { display: flex; gap: 28px; }
  #dash .bank .nums b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  #dash .bank .nums span { font-size: 10px; letter-spacing: .18em; color: var(--dim); font-weight: 700; }
  #dash .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: 2px;
                 background: var(--hover); color: var(--dim); font-weight: 600; letter-spacing: .04em; }
  #dash .repo { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  #dash .repo:first-of-type { border-top: 0; }
  #dash .repo:hover { background: var(--hover); }
  #dash .repo .r b { display: block; font-size: 15px; }
  #dash .repo .r code { font-size: 13px; color: var(--dim); }
  #dash .repo .x { text-align: right; } #dash .repo .x b { font-size: 18px; } #dash .repo .x div { color: var(--dim); font-size: 12px; }
  #dash .warn { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 9px 0; align-items: start; font-size: 15px; }
  #dash .warn a { color: var(--cyan); font-size: 13px; text-decoration: none; white-space: nowrap; }
  #dash .lvl { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #1d1405; margin-top: 2px; }
  #dash .head { display: flex; gap: 18px; align-items: center; }
  #dash .head .big { font-size: 40px; }
  @media (max-width: 900px) { #dash .strip { grid-template-columns: 1fr 1fr; } #dash .grid2 { grid-template-columns: 1fr; } }
  #panel { scrollbar-width: thin; z-index: 3; }
  #idx { background: var(--panel); color: var(--accent); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  #idx:disabled { color: var(--dim); cursor: default; }
  #idx:focus-visible, #theme:focus-visible, #dash button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #theme { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; font: inherit; cursor: pointer; }
  #theme:hover { color: var(--ink); }
  .tn { display: grid; grid-template-columns: minmax(0, 1fr) 112px 132px 132px 92px; gap: 10px; align-items: center;
        padding: 3px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .tn:hover { background: var(--hover); }
  .tn.sel { background: var(--sel); }
  .tn .nm { overflow: hidden; text-overflow: ellipsis; }
  .tn .c { color: var(--dim); text-align: right; }
  .tn .tw { color: var(--dim); font-size: 11px; }
  .tb { display: flex; height: 7px; border-radius: 2px; overflow: hidden; background: var(--track); }
  .tb i { display: block; height: 100%; }
  .th { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .th:hover { background: none; cursor: default; }
  /* narrow windows: keep name, count and rows; drop the type bar and the date */
  @media (max-width: 1400px) {
    .tn { grid-template-columns: minmax(0, 1fr) 112px 132px; }
    .tn > :nth-child(4), .tn > :nth-child(5) { display: none; }
  }
  .more { color: var(--link); padding: 3px 6px; cursor: pointer; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
         padding: 6px 9px; display: none; max-width: 340px; }
  .help { color: var(--dim); font-size: 12px; }
  .help code { color: var(--ink); }
</style>
</head>
<body>
<nav id="side"></nav>
<div id="dash"></div>
<canvas id="c"></canvas>
<div id="bar"><span id="tabs"></span><input id="q" spellcheck="false" autocomplete="off"
  placeholder="query: words · repo:neo · tier:main · home:mirror · month:2026-07 · rows>1000 · think>0 · errors>=20 · -tier:wf"><span id="count"></span><button id="idx" title="index new transcripts now (incremental)" style="display:none"></button><button id="theme" title="theme: auto / dark / light"></button></div>
<div id="tree"></div>
<div id="legend"></div>
<div id="panel"></div>
<div id="tip"></div>
<script>
const D = /*DATA*/null;
const SERVED = location.protocol.startsWith("http");
// theme: auto (follows the system), dark or light; a choice is kept in localStorage
const THEME_PICK = localStorage.getItem("relic-theme") || "auto";
const LIGHT = THEME_PICK === "light" || (THEME_PICK === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
document.documentElement.dataset.theme = LIGHT ? "light" : "dark";
// one page, three views: /map, /tree and /paths when served, ?view=tree|paths when opened as a file
// served: / is Smart Scan; opened as a file (no server, no index button): the map
const VIEWS = ["scan", "banks", "health", "map", "tree", "paths"];
const VIEW = VIEWS.find(v => location.pathname.endsWith("/" + v) || new URLSearchParams(location.search).get("view") === v)
  || (location.protocol.startsWith("http") && /\/$/.test(location.pathname) ? "scan" : "map");
const DASH = ["scan", "banks", "health"].includes(VIEW);
const S = D.s, N = S.sid.length, BKK = 7 * 3600;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n.toLocaleString("en-US");
const TIER = ["main", "subagent", "workflow-agent"];
// rows by type: [key in the data, label, colour]; errors are a subset of results
const TYPES = LIGHT
  ? [["user", "user text", "#c98a00"], ["asst", "assistant text", "#8a6d1f"], ["think", "thinking", "#c2407a"],
     ["calls", "tool calls", "#1f8ac0"], ["results", "tool results", "#245f9e"], ["errors", "tool errors", "#d4441c"]]
  : [["user", "user text", "#ffd166"], ["asst", "assistant text", "#ffe6a8"], ["think", "thinking", "#ff9ec7"],
     ["calls", "tool calls", "#7fd3ff"], ["results", "tool results", "#5aa9e6"], ["errors", "tool errors", "#ff7a59"]];
const TYPE_KEYS = new Set(TYPES.map(t => t[0]).concat(["rows", "text", "msgs", "copies", "tools"]));
const tools = k => S.calls[k] + S.results[k];
const COLOR = LIGHT ? ["#b26b00", "#1f7fbf", "#6a4bd1"] : ["#ffe6a8", "#7fd3ff", "#b89cff"];
// canvas colours that are not data: rings, labels, links, the hover ring; stars add up as light on dark, ink on light
const INK = LIGHT
  ? { ring: "#e2e6ef", year: "#b9c2d6", month: "#8a93a8", label: "#4f5870", link: "rgba(60,80,140,.25)", sel: "rgba(212,68,28,.6)",
      hover: "#1c2233", hit: "#d4441c", off: "#c3c9d6", blend: "source-over", alpha: [0.85, 0.45, 0.06] }
  : { ring: "#141a28", year: "#2b3550", month: "#4a5470", label: "#6f7a96", link: "rgba(140,160,220,.18)", sel: "rgba(255,122,89,.55)",
      hover: "#ffffff", hit: "#ff7a59", off: "#3a4258", blend: "lighter", alpha: [0.8, 0.32, 0.04] };
const cat = k => S.cat[k] < 0 ? "(none)" : D.cats[S.cat[k]];
const proj = k => S.proj[k] < 0 ? "" : D.projs[S.proj[k]];
const bkk = t => t == null ? "—" : new Date((t + BKK) * 1000).toISOString().slice(0, 16).replace("T", " ");

// ---------- layout: ring = month, sector = repo, satellites orbit their parent ----------
function hash(str, salt) {
  let h = 2166136261 ^ salt;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  // murmur3 finaliser: without it, sequential ids (agent-…01, …02) land on a straight line
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const monthIdx = t => { const d = new Date((t + BKK) * 1000); return d.getUTCFullYear() * 12 + d.getUTCMonth(); };
const mLabel = m => `${Math.floor(m / 12)}-${String(m % 12 + 1).padStart(2, "0")}`;
let m0 = Infinity, m1 = -Infinity;
for (let k = 0; k < N; k++) if (S.t0[k] != null) { const m = monthIdx(S.t0[k]); m0 = Math.min(m0, m); m1 = Math.max(m1, m); }
const R0 = 140, DR = 64, RINGS = m1 - m0 + 1, ROUT = R0 + RINGS * DR;
const radius = t => {
  if (t == null) return ROUT + 46;
  const m = monthIdx(t), y = Math.floor(m / 12), mo = m % 12;
  const a = Date.UTC(y, mo, 1) / 1000 - BKK, b = Date.UTC(y, mo + 1, 1) / 1000 - BKK;
  return R0 + (m - m0 + (t - a) / (b - a)) * DR;
};
// sectors: repos sorted by sessions, width ~ sessions^0.8; repos under SMALL sessions share one sector
const SMALL = 12, OTHER = -2;
const perCat = new Map();
for (let k = 0; k < N; k++) perCat.set(S.cat[k], (perCat.get(S.cat[k]) || 0) + 1);
const secOf = new Map([...perCat].map(([c, n]) => [c, n < SMALL ? OTHER : c]));
const perSec = new Map();
for (const [c, n] of perCat) perSec.set(secOf.get(c), (perSec.get(secOf.get(c)) || 0) + n);
const cats = [...perSec.entries()].sort((a, b) => (a[0] === OTHER) - (b[0] === OTHER) || b[1] - a[1]);
const GAP = 0.006, total = cats.reduce((a, [, n]) => a + n ** 0.8, 0);
const sector = new Map();
let a0 = -Math.PI / 2 + 0.02;
for (const [c, n] of cats) {
  const w = (n ** 0.8 / total) * (2 * Math.PI - 0.04 - GAP * cats.length);
  sector.set(c, [a0, w, n]); a0 += w + GAP;
}
const smallRepos = [...perCat].filter(([, n]) => n < SMALL).length;
const secName = c => c === OTHER ? `${smallRepos} small repos` : c < 0 ? "(none)" : D.cats[c];
const X = new Float32Array(N), Y = new Float32Array(N), SIZE = new Float32Array(N);
const kids = Array.from({ length: N }, () => []);
for (let pass = 0; pass < 2; pass++) for (let k = 0; k < N; k++) {
  const sat = S.tier[k] > 0 && S.parent[k] >= 0;
  if ((pass === 0) === sat) continue;
  const lr = Math.log10(1 + S.rows[k]);
  if (sat) {
    const p = S.parent[k], o = 2.5 + 7 * hash(S.sid[k], 7), a = 2 * Math.PI * hash(S.sid[k], 3);
    X[k] = X[p] + o * Math.cos(a); Y[k] = Y[p] + o * Math.sin(a);
    SIZE[k] = 0.45 + 0.3 * lr; kids[p].push(k);
  } else {
    const [s0, w] = sector.get(secOf.get(S.cat[k])), a = s0 + w * (0.06 + 0.88 * hash(S.sid[k], 1)), r = radius(S.t0[k]);
    X[k] = r * Math.cos(a); Y[k] = r * Math.sin(a);
    SIZE[k] = S.tier[k] === 0 ? 0.8 + 0.75 * lr : 0.5 + 0.35 * lr;
  }
}

// ---------- query ----------
const match = new Uint8Array(N).fill(1);
let active = false;
const TIERS = { main: 0, sub: 1, subagent: 1, wf: 2, workflow: 2, "workflow-agent": 2 };
function test(k, key, op, val) {
  const v = val.toLowerCase();
  switch (key) {
    case "tier": return S.tier[k] === TIERS[v];
    case "repo": case "cat": return cat(k).toLowerCase().includes(v);
    case "proj": return proj(k).toLowerCase().includes(v);
    case "sid": return S.sid[k].toLowerCase().startsWith(v);
    case "home": return S.homes[k].some(h => (D.homes[h].path + " " + D.homes[h].origin).toLowerCase().includes(v));
    case "month": return S.t0[k] != null && mLabel(monthIdx(S.t0[k])).startsWith(v);

// ---------- paths: every .jsonl the scan saw, as a folder tree (data from /paths.json, loaded only here) ----------
// status: indexed (parsed into the months) · skipped (in a home, but the sniff said not a transcript)

const STATUS = [["indexed", COLOR[1]], ["skipped", INK.hit], ["vault", COLOR[2]], ["loose", LIGHT ? "#8a93a8" : "#7c8496"]];
let P = null, PN = 0, pm, pdir, plow, pact = false, pcount = 0, psel = -1;
const nodes = []; // folder trie: { name, parent, kids: Map(name -> id), files: [] }
const popen = new Set([0]), pcap = new Map();

const ppath = i => P.dirs[P.f.d[i]] + "/" + P.f.n[i];

let agg; // per trie node: [files, bytes, rows, indexed, skipped, vault, loose]
function loadPaths() {
  $("tree").innerHTML = `<div class="muted" style="padding:20px">loading paths…</div>`;
  fetch("/paths.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {

function ptest(i, t) {

    case "verdict": return (P.verdicts[P.f.v[i]] || "").includes(v);
    case "name": return P.f.n[i].toLowerCase().includes(v);
    case "size": return cmp(P.f.size[i], t.op, Number(v));
    case "mb": return cmp(P.f.size[i] / 1e6, t.op, Number(v));
    case "rows": return cmp(P.f.rows[i], t.op, Number(v));

}
function prun(q) {
  if (!P) return;

    let ok = true;

    pm[i] = ok ? 1 : 0; pcount += ok;

  for (let i = 0; i < PN; i++) if (pm[i]) {
    const st = pstat(i);

  history.replaceState(null, "", location.pathname + location.search + (q ? "#" + encodeURIComponent(q) : ""));
  $("count").textContent = pact ? `${fmt(pcount)} / ${fmt(PN)} .jsonl` : `${fmt(PN)} .jsonl`;
  tabs(); psummary(); prender();
}
function statBar(a) {

  if (!opn) return;

    ["info", `${fmt(SC.skipped)} files in agent homes are not transcripts (workflow journals, prompt logs, omx logs) and were skipped by the content sniff.`, ["/paths#is:skipped", "see them"]],
    ["info", `${fmt(SC.unknown)} files had no recognised shape and were indexed anyway: a transcript-shaped path is never dropped.`, SC.unknown ? ["/paths#verdict:unknown", "see them"] : null],
    ["info", `${mirrors} of ${D.homes.length} homes are mirrors, rescues or copies; the same line read twice is folded into one row.`, ["/banks", "banks"]],
    ["info", `Tool errors: ${fmt(T.ty[5])}, ${errPct.toFixed(1)}% of tool results.`, ["/map#errors>=20", "sessions with 20+"]],
  ];
  const warns = checks.filter(c => c[0] === "warn").length;
  const L = { ok: ["var(--green)", "✓"], warn: ["var(--amber)", "!"], info: ["var(--cyan)", "i"] };
  return `<div class="eyebrow">System readiness</div><h1>Health</h1>
    <p class="sub">Signals computed from this index itself: nothing here is estimated.</p>${scopeLine()}
    <div class="card head"><span class="big" style="color:${warns ? "var(--amber)" : "var(--green)"}">${warns ? "⚠" : "✓"}</span>
      <div><b style="font-size:18px">${warns ? `${warns} warning${warns > 1 ? "s" : ""} reported` : "All clear"}</b>
      <div class="note" style="margin:2px 0 0">Page built ${esc(D.built)} · ${esc(D.out || "")}</div></div></div>
    <div class="strip">${stat("Rows", fmt(T.rows), "var(--cyan)")}${stat("Sessions", fmt(N), "var(--green)")}${stat("Months", fmt(T.months), "var(--amber)")}${stat("Warnings", warns, warns ? "var(--amber)" : "var(--green)")}</div>
    <div class="card"><h3>Checks</h3>${checks.map(([lv, txt, link]) => `<div class="warn"><span class="lvl" style="background:${L[lv][0]}">${L[lv][1]}</span>
      <div>${txt}</div>${link ? `<a href="${link[0]}">${link[1]} →</a>` : "<span></span>"}</div>`).join("")}</div>`;
}
function renderDash() {
  $("dash").innerHTML = VIEW === "scan" ? dashScan() : VIEW === "banks" ? dashBanks() : dashHealth();
  for (const el of $("dash").querySelectorAll("[data-go]")) el.onclick = () => { location.href = el.dataset.go; };
  const more = $("rmore"); if (more) more.onclick = e => { e.preventDefault(); repoCap += 100; renderDash(); };
  if ($("dgo")) {
    $("dgo").onclick = () => $("idx").click();
    $("dref").onclick = () => location.reload();
  }
}
// a run's progress, from the index button's poll: the sidebar state and the Smart Scan card follow it
window.onRun = st => {
  if ($("sstate")) { $("sstate").textContent = st.running ? "INDEXING" : "RELIC READY"; $("sdot").style.background = st.running ? "var(--amber)" : "var(--green)"; }
  if (!$("dgo") || !st.running) return;
  $("dgo").disabled = true; $("dgo").textContent = "Indexing…";
  const f = st.phase === "parse" && st.total ? st.done / st.total : st.phase === "scan" ? 0.03 : st.phase === "merge" ? 0.92 : st.phase === "meta" ? 0.97 : 0;
  $("dbar").style.width = (100 * f).toFixed(1) + "%";
  $("dmsg").textContent = st.phase === "scan" ? `scan · ${st.walked.toLocaleString()} entries walked · ${st.listed.toLocaleString()} .jsonl listed`
    : st.phase === "parse" ? `parse · ${(st.done / 1e9).toFixed(1)} / ${(st.total / 1e9).toFixed(1)} GB` : `${st.phase}…`;
  $("dmsg").textContent += ` · ${Math.round(st.secs || 0)}s`;
};

// ---------- legend + input ----------
function legend() {
  $("legend").innerHTML = TIER.map((t, i) => `<button class="${tierOn[i] ? "on" : ""}" data-t="${i}"><b style="background:${COLOR[i]}"></b>${t}</button>`).join("")
    + (VIEW === "tree" ? "" : ` <span>color:</span>` + ["tier", "repo", "age", "tools%", "thinking"].map(c => `<button class="${colorBy === c ? "on" : ""}" data-c="${c}">${c}</button>`).join(""));
  for (const el of $("legend").querySelectorAll("[data-t]")) el.onclick = () => { tierOn[+el.dataset.t] = !tierOn[+el.dataset.t]; legend(); run($("q").value); };
  for (const el of $("legend").querySelectorAll("[data-c]")) el.onclick = () => { colorBy = el.dataset.c; legend(); redraw(); };
}
let timer;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => run($("q").value), 180); });
$("q").addEventListener("keydown", e => { if (e.key === "Escape") { $("q").value = ""; run(""); } });

let drag = null, moved = false;
cv.addEventListener("mousedown", e => { drag = [e.clientX, e.clientY, ox, oy]; moved = false; });
addEventListener("mouseup", e => {
  if (drag && !moved && e.target === cv) { const k = nearest(e.clientX, e.clientY); select(k); }
  drag = null;
});
addEventListener("mousemove", e => {
  if (drag) {
    const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    ox = drag[2] + dx; oy = drag[3] + dy; redraw(); return;
  }
  if (e.target !== cv) return;
  const k = nearest(e.clientX, e.clientY), tip = $("tip");
  if (k !== hover) { hover = k; redraw(); }
  if (k < 0) { tip.style.display = "none"; return; }
  tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 12 + "px";
  tip.innerHTML = `<span style="color:${COLOR[S.tier[k]]}">${TIER[S.tier[k]]}</span> · ${esc(cat(k))}<br>
    <code>${esc(S.sid[k])}</code><br>${bkk(S.t0[k])} · ${fmt(S.rows[k])} rows · ${S.copies[k]} cop${S.copies[k] === 1 ? "y" : "ies"}`;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015), x = e.clientX, y = e.clientY;
  ox = x - (x - ox) * f; oy = y - (y - oy) * f; scale *= f; redraw();
}, { passive: false });
cv.addEventListener("dblclick", () => { home(); redraw(); });
addEventListener("resize", () => { fit(); redraw(); });

if (VIEW !== "map") { cv.style.display = "none"; document.documentElement.classList.add("doc"); }
if (DASH) {
  for (const id of ["q", "count", "panel", "legend"]) $(id).style.display = "none";
  $("bar").style.right = "14px"; $("bar").style.justifyContent = "flex-end"; $("bar").style.background = "transparent";
  $("dash").style.display = "block";
} else if (VIEW !== "map") $("tree").style.display = "block";
$("theme").textContent = { auto: "◐ auto", dark: "● dark", light: "○ light" }[THEME_PICK];
// served (not opened as a file): an index button that runs an incremental run in the server and reloads when done
if (SERVED) {
  const b = $("idx"); b.style.display = ""; b.textContent = "⟳ index";
  const gb = x => (x / 1e9).toFixed(1);
  const poll = async () => {
    const s = await (await fetch("/api/status")).json();
    window.onRun(s);
    if (s.running) {
      b.disabled = true;
      b.textContent = s.phase === "parse" && s.total ? `⟳ parse ${Math.round(100 * s.done / s.total)}% · ${gb(s.done)}/${gb(s.total)} GB`
        : s.phase === "scan" ? `⟳ scan · ${s.listed.toLocaleString()} .jsonl` : `⟳ ${s.phase}…`;
      return setTimeout(poll, 700);
    }
    if (b.disabled) { if (s.last_error) { b.disabled = false; b.textContent = "⟳ failed: " + s.last_error.slice(0, 40); } else location.reload(); }
  };
  b.onclick = async () => {
    b.disabled = true; b.textContent = "⟳ starting…";
    const r = await fetch("/api/run", { method: "POST", headers: { "X-Relic": "1" } });
    if (!r.ok && r.status !== 409) { b.disabled = false; b.textContent = "⟳ " + ((await r.json()).error || r.status); return; }
    poll();
  };
  poll();
}
$("theme").onclick = () => {
  const next = { auto: "dark", dark: "light", light: "auto" }[THEME_PICK];
  localStorage.setItem("relic-theme", next); location.reload();
};
fit(); home();
const homeScale = scale;
$("q").value = decodeURIComponent(location.hash.slice(1));
if (DASH) {
  tabs(); renderDash();
} else if (VIEW === "paths") {
  $("q").placeholder = "paths: words in the path · is:indexed|skipped|vault|loose · verdict:not-transcript · mb>100 · rows=0 · -word";
  tabs(); loadPaths();
} else {
  legend();
  run($("q").value);
}
</script>
</body>
</html>
