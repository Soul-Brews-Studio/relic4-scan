<h1>Every agent transcript, found and kept.</h1>
<p>Claude Code, Codex, OMP, OMX, Gemini and Pi leave thousands of <code>.jsonl</code> files across homes, mirrors and archives. <strong>ARRA Relic Scan finds every one, indexes it into one Parquet file per month, and lets you browse it on your own machine.</strong> Nothing leaves it.</p>
<p><a href="https://github.com/Soul-Brews-Studio/relic4-scan/releases/download/v26.10.23-alpha.1117/ARRA-Relic-Scan_26.10.23-alpha.1117_macos-arm64.dmg">Download for macOS</a> · <a href="#get">Linux and the CLI</a><br><small>Private beta · the downloads need access to Soul-Brews-Studio on GitHub · Apple silicon and Intel Macs, Linux x86_64</small></p>
<h2>Measured</h2><ul><li><b>58 s</b> to index 86,904 transcripts (75.6 GB) from cold</li><li><b>≈15 s</b> to bring that index up to date, reading only new bytes</li><li><b>5.5 M</b> rows: every message, thinking block, tool call and result</li><li><b>0</b> network calls from the app or its page</li></ul><p><small>Measured on one Apple-silicon Mac, October 2026, over its own agents' history. Your numbers follow your disk.</small></p>
<h2>Start in the terminal</h2><p><code>relic-scan tui</code> reads the index: overview, repositories, sessions and every <code>.jsonl</code>.</p><p><code>/</code> filters · <code>Enter</code> opens · <code>⌫</code> goes back · no background of its own, so it reads on dark and light terminals</p>
<h2>The whole index at a glance</h2><p>Smart Scan shows every row by kind, the sessions and files behind them, and how far back your history goes.</p><ul><li>user text, AI text, thinking, tool calls, results and errors</li><li>Check changes and Index now, one click each</li><li>the output folder under every title: Open folder, Export list</li></ul>
<h2>Check before you index</h2><p>Check changes walks your folders and says what an index would read. It writes nothing.</p><ul><li>new, grown, rewritten and gone files, with the bytes to read</li><li>every index and every check kept in a scan log you can open</li><li>Stop ends a run during the walk or the parse, with nothing written</li></ul>
<h2>See what your agents wrote</h2><p>Pick a kind of row and see where it came from.</p><ul><li>main sessions, subagents and workflow agents</li><li>own homes, mirrors, archives and rescued copies</li><li>agent by agent, month by month, stacked by kind</li></ul>
<h2>Every session as a star</h2><p>Rings are the months a session started; sectors are repositories. Subagents orbit the session that started them.</p><ul><li>a query language: <code>repo:</code> <code>month:</code> <code>tier:</code> <code>errors&gt;=20</code></li><li>click a star for its rows, its copies and <code>claude --resume</code></li><li>⌘K finds any session, repo, home, file or scan</li></ul>
<h2>Home, repository, session</h2><p>The same index as a tree, newest first, with rows by kind on every line.</p><ul><li>open a bank and see only that bank, with the way back</li><li>export what you see as CSV or JSON, with the time and the query</li></ul>
<h2>Where the gigabytes are</h2><p>Every <code>.jsonl</code> by folder and size, as rings, one colour per branch. Click to go in; open any folder in Finder.</p><ul><li>indexed and not-indexed bytes for every folder</li><li>folders the scan could not read, listed in Health</li></ul>
<h2>Every oracle's memory, too</h2><p>The same walk finds every <code>ψ</code> vault: an oracle's learnings, retrospectives, inbox and writing. Open one and its notes are grouped by folder, newest first.</p><ul><li>each vault once, however many repos link to it</li><li>git worktree copies kept apart, cloned repos inside skipped</li><li>written as plain JSON: <code>meta/vaults.json</code></li></ul>
<h2>Read a note where it lives</h2><p>Click a note and it opens rendered: front matter, headings, lists, code and tables. Nothing is copied, nothing leaves the machine.</p><ul><li>filter a vault's notes by words in the title or path</li><li>Show in Finder from the reader</li><li>export a vault's notes as CSV</li></ul>
<h2>Take the metadata with you</h2><p>Every table the index holds, as CSV or JSON, in one place. The rows stay in one Parquet file per month, each one click from Finder.</p><ul><li>sessions, files, homes, scans and vaults</li><li>saved to ~/Downloads with the time it was exported</li><li>click a month to show its file in Finder</li></ul>
<h2>It stays on your machine.</h2><ul><li><b>127.0.0.1</b>: The page is served on this machine only, and makes no network calls.</li><li><b>on a click</b>: Nothing is written until you press Index now. Checks only read.</li><li><b>~/.relic-scan</b>: Your index is plain Parquet: one file per month, plus sessions, files and every .jsonl.</li><li><b>four ways in</b>: A desktop app, the page in any browser, a terminal UI, and the <code>relic-scan</code> command.</li></ul>
<h2>Questions</h2><dl><dt><b>What is ARRA Relic Scan?</b></dt><dd>A desktop app and command-line tool that finds every AI-agent transcript on your machine, indexes it into one Parquet file per month, and lets you browse it locally: a dashboard, a session map, a tree, a disk view and a terminal UI.</dd><dt><b>Which agents does it read?</b></dt><dd>Claude Code, Codex, OMP, OMX, Gemini, Pi and thClaws: any .claude, .codex, .omp, .omx, .gemini, .pi or .thclaws home, plus backups, mirrors and archived copies of them.</dd><dt><b>Does it upload my transcripts anywhere?</b></dt><dd>No. The app serves its page on 127.0.0.1 only, the page makes no network calls, and the index is written to ~/.relic-scan on your own disk.</dd><dt><b>Does it change my transcript files?</b></dt><dd>No. It only reads them; everything it writes goes to its own folder (~/.relic-scan), and Check changes writes nothing at all.</dd><dt><b>How fast is it?</b></dt><dd>On one Apple-silicon Mac it indexed 86,904 transcripts (75.6 GB) in 58 seconds from cold, and brings that index up to date in about 15 seconds by reading only new bytes.</dd><dt><b>What format is the index?</b></dt><dd>Plain Parquet: one file per month of rows (every message, thinking block, tool call and result), plus sessions, files and every .jsonl, readable by DuckDB, Polars or pandas.</dd><dt><b>Which platforms does it run on?</b></dt><dd>macOS on Apple silicon and on Intel (a .dmg each), and Linux x86_64 (.deb and .AppImage); the relic-scan command builds on macOS and Linux with Rust.</dd><dt><b>Is it free and open source?</b></dt><dd>It is a private beta: the downloads sit in a private GitHub repository and need access to the Soul-Brews-Studio organisation.</dd></dl>
<h2 id="get">Download</h2><p>Version 26.10.23-alpha.1117, a private beta. The files sit in a private GitHub repository: sign in with an account that has access to Soul-Brews-Studio.</p><ul><li><a href="https://github.com/Soul-Brews-Studio/relic4-scan/releases/download/v26.10.23-alpha.1117/ARRA-Relic-Scan_26.10.23-alpha.1117_macos-arm64.dmg">macOS: .dmg · 6.7 MB</a> (Apple silicon · drag into Applications)</li><li><a href="https://github.com/Soul-Brews-Studio/relic4-scan/releases/download/v26.10.23-alpha.1117/ARRA-Relic-Scan_26.10.23-alpha.1117_macos-x64.dmg">macOS: .dmg · 7.1 MB</a> (Intel · drag into Applications)</li><li><a href="https://github.com/Soul-Brews-Studio/relic4-scan/releases/download/v26.10.23-alpha.1117/ARRA-Relic-Scan_26.10.23-alpha.1117_linux-amd64.deb">Linux: .deb · 7.6 MB</a> (x86_64 · Debian, Ubuntu)</li><li><a href="https://github.com/Soul-Brews-Studio/relic4-scan/releases/download/v26.10.23-alpha.1117/ARRA-Relic-Scan_26.10.23-alpha.1117_linux-amd64.AppImage">Linux: .AppImage · 85 MB</a> (x86_64 · any distribution)</li></ul>
<pre>gh api repos/Soul-Brews-Studio/relic4-scan/contents/install.sh \
  -H 'Accept: application/vnd.github.raw' | sh</pre>
<h2>Build it yourself</h2><p>The source is a Rust workspace with a <code>justfile</code>. You need Rust, <code>just</code> and access to the repository on GitHub.</p><ol><li>Get the source<pre>gh repo clone Soul-Brews-Studio/relic4-scan &amp;&amp; cd relic4-scan</pre></li><li>Get the tools<pre>curl https://sh.rustup.rs -sSf | sh   # Rust
brew install just                     # or: cargo install just</pre></li><li>Build the command<pre>just build     # target/release/relic-scan
just install   # copies it into ~/.local/bin</pre></li><li>Build the desktop app<pre>just app         # .app and .dmg for this Mac
just app-intel   # the same for Intel Macs, from Apple silicon
just linux       # .deb and .AppImage, in Docker</pre></li></ol><p><code>just</code> lists every recipe; <code>just test</code> runs the tests; <code>just up</code> indexes this machine and serves the page on 127.0.0.1.</p>
<p>Your agents keep everything they did. Now you can find it.</p>
