# Publishes site/public (the landing page) to GitHub Pages on every push to main that touches it.
# GitHub Pages needs a public repository on the free plan.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4
